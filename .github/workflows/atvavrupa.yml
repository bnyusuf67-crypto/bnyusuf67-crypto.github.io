name: atvavrupa

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Derinlik 1 ile Hızlı Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Hızlı Bağımlılık Kurulumu
        run: pip install --no-cache-dir requests -qq

      - name: Scripti Çalıştır
        run: python3 atvavrupa.py 

      - name: Hızlı Commit & Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add streams/
          git commit -m "Updated At: $(date +'%H:%M')" || echo "Değişiklik yok"
          git push
